# Toutes les heures, publie les posts dont l'heure est passée,
# puis enregistre leur nouveau statut dans le dépôt.
# Il supprime aussi les visuels des posts publiés depuis plus de 24 h,
# et réduit la branche des visuels à un seul commit pour que le dépôt reste léger.
name: Publier les posts

on:
  schedule:
    # Toutes les 15 minutes, en évitant les heures pile, encombrées chez GitHub.
    # GitHub saute parfois un passage quand il est chargé : le suivant rattrape le retard.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: cadence-publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # une vidéo 4K à recoller, ou à copier en 1080p pour Instagram
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publier ce qui est dû
        id: robot
        continue-on-error: true   # on enregistre les statuts même si un réseau a échoué
        run: node robot/publish.mjs
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ID: ${{ secrets.ZERNIO_TIKTOK_ID }}
          ZERNIO_LINKEDIN_ID: ${{ secrets.ZERNIO_LINKEDIN_ID }}
          GITHUB_TOKEN: ${{ github.token }}   # pour supprimer les visuels publiés

      - name: Enregistrer les statuts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts
          git add -A media 2>/dev/null || true   # anciens visuels rangés avec le code
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Robot : statuts de publication"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      - name: Alléger la branche des visuels
        # Un seul commit, avec les visuels encore en attente : les fichiers supprimés ne pèsent plus.
        # Si Cadence envoie un visuel au même moment, on ne force rien et on réessaie au prochain passage.
        run: |
          git fetch --quiet origin media 2>/dev/null || exit 0
          old=$(git rev-parse FETCH_HEAD)
          [ "$(git rev-list --count FETCH_HEAD)" -gt 1 ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          new=$(git commit-tree "FETCH_HEAD^{tree}" -m "Visuels en attente de publication")
          git push --force-with-lease=refs/heads/media:"$old" origin "$new:refs/heads/media" \
            || echo "Un visuel vient d'arriver : la branche sera allégée au prochain passage."

      - name: Signaler un échec (GitHub t'envoie un e-mail)
        if: steps.robot.outcome == 'failure'
        run: exit 1
