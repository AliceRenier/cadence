# Chaque matin, vérifie que les accès Meta, YouTube et Zernio marchent encore.
# Si l'un d'eux ne fonctionne plus, la tâche échoue et GitHub t'envoie un e-mail.
name: Vérifier les accès

on:
  schedule:
    - cron: "17 6 * * *"   # 7 h 17 à Paris en hiver, 8 h 17 en été
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node robot/publish.mjs --check
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
