# À lancer à la main pendant la mise en route : affiche tes comptes Zernio
# (TikTok, LinkedIn) et leurs identifiants. N'affiche jamais de secret.
name: Aide — trouver mes identifiants

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comptes Zernio
        run: node robot/publish.mjs --zernio-accounts
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
